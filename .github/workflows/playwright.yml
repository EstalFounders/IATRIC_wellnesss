name: Playwright Tests
# `staging` is a deploy target too (see deploy.yml -> PM2 HealthPath-Staging), so a
# merge / push into it must run the E2E suite as well, not just main:
#   - `push`         -> catches direct pushes AND the merge commit of a merged PR
#   - `pull_request` -> catches the PR itself, before it is merged
# `feature-branch` is the working branch and has no deploy target, so a push there runs
# *only* this workflow: deploy.yml stays on main/staging, which makes the suite the
# single gate on the branch before it is merged into staging.
on:
  push:
    branches: [ main, master, staging, feature-branch ]
  pull_request:
    branches: [ main, master, staging ]
  # Allow a manual run from the Actions tab (same as the deploy workflow).
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
